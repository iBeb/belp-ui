# What Dependabot may interrupt for, and how often.
#
# Two ecosystems, because a Go app has two kinds of dependency and only one of
# them is in go.mod: the workflow pins actions by major tag, and a tag moving
# under CI is exactly the kind of drift nobody notices until a run fails.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # One pull request per ecosystem rather than one per module. These are small
    # repos with a handful of shared dependencies; five separate bumps of the
    # charm libraries is five reviews of the same decision.
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
