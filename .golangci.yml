# Defaults plus formatting and a few readability checks. Deliberately short:
# a wall of linters gets disabled wholesale the first time it is inconvenient.
version: "2"

run:
  timeout: 3m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are on by default in v2.
  enable:
    - bodyclose
    - misspell
    - revive # golint's successor: naming, exported comments
    - unconvert
  settings:
    misspell:
      locale: UK
      # Color is lipgloss's spelling of its own API, not prose we can correct.
      ignore-rules:
        - color
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are required by review, not by a linter
  exclusions:
    # v1 applied these silently; v2 makes them a choice.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck] # a failed Close in a test is not the point

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/iBeb
